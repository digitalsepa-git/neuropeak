<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Belgeler · NeuroPeak</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f5fb;
        --surface: #ffffff;
        --text: #120e20;
        --muted: #6f6a80;
        --line: #dcd9e8;
        --accent: #6c3bf4;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #120e20;
          --surface: #272047;
          --text: #ffffff;
          --muted: #a8a2c4;
          --line: #272047;
          --accent: #a88df9;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0 16px 64px;
        background: var(--bg);
        color: var(--text);
        font:
          17px/1.65 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        -webkit-text-size-adjust: 100%;
      }

      .wrap {
        max-width: 68ch;
        margin: 0 auto;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: baseline;
        justify-content: space-between;
        padding: 32px 0 24px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        text-decoration: none;
      }

      h1 {
        font-size: 32px;
        line-height: 1.2;
        margin: 32px 0 8px;
      }
      h2 {
        font-size: 22px;
        line-height: 1.3;
        margin: 40px 0 8px;
      }
      h3 {
        font-size: 18px;
        margin: 28px 0 8px;
      }

      a {
        color: var(--accent);
      }

      main :is(ul, ol) {
        padding-left: 1.3em;
      }
      main li {
        margin: 6px 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        font-size: 15px;
      }
      th,
      td {
        border: 1px solid var(--line);
        padding: 8px 10px;
        text-align: left;
      }
      th {
        background: var(--surface);
      }

      code {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 0.9em;
      }

      footer {
        margin-top: 56px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 15px;
      }

      @media (max-width: 480px) {
        h1 {
          font-size: 27px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header><a class="brand" href="./">NeuroPeak</a></header>
      <main>
        <h1>NeuroPeak</h1>
        <p>Gizlilik politikası ve kullanım şartları — privacy policy and terms of use.</p>
        <ul>
          <li><a href="privacy/">Gizlilik Politikası</a> <span>(tr)</span></li>
          <li><a href="terms/">Kullanım Şartları</a> <span>(tr)</span></li>
          <li><a href="en/privacy/">Privacy Policy</a> <span>(en)</span></li>
          <li><a href="en/terms/">Terms of Use</a> <span>(en)</span></li>
        </ul>
      </main>
      <footer><a href="mailto:destek@neuropeak.app">destek@neuropeak.app</a></footer>
    </div>
  </body>
</html>
